<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalorien-Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF1E9;
    --surface:#FFFFFF;
    --border: rgba(20,35,27,0.14);
    --text:#14231B;
    --text-soft:#5B6B60;
    --amber:#E3963A;
    --amber-soft: rgba(227,150,58,0.14);
    --teal:#2F6F5E;
    --teal-soft: rgba(47,111,94,0.12);
    --red:#C1443B;
    --red-soft: rgba(193,68,59,0.12);
    --ring-track: rgba(20,35,27,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:20px 18px 48px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; font-weight:600;}
  .top{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;
  }
  .top h1{font-size:22px;}
  .top .date{font-size:13px; color:var(--text-soft);}
  .tabs{
    display:flex; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:4px; margin-bottom:20px;
  }
  .tab{
    flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:14px; font-weight:600;
    color:var(--text-soft); cursor:pointer; border:none; background:transparent; font-family:inherit;
  }
  .tab.active{background:var(--text); color:#fff;}
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px; margin-bottom:14px;
  }

  /* Ring */
  .ring-wrap{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px;}
  .ring-wrap svg{width:200px; height:200px;}
  .ring-num{font-family:'Space Grotesk'; font-size:40px; font-weight:700; line-height:1;}
  .ring-label{font-size:13px; color:var(--text-soft); margin-top:4px;}
  .stat-row{display:flex; justify-content:space-between; margin-top:16px; text-align:center;}
  .stat{flex:1;}
  .stat .v{font-family:'Space Grotesk'; font-size:17px; font-weight:600;}
  .stat .l{font-size:12px; color:var(--text-soft); margin-top:2px;}
  .stat + .stat{border-left:1px solid var(--border);}

  .actions{display:flex; gap:10px; margin-bottom:16px;}
  .btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:13px 10px; border-radius:12px; font-size:14px; font-weight:600;
    border:none; cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--text); color:#fff;}
  .btn-outline{background:var(--surface); color:var(--text); border:1px solid var(--border);}
  .btn-ghost{background:transparent; color:var(--teal); font-weight:600; border:none; padding:8px; font-size:13px; cursor:pointer; font-family:inherit;}

  .quick-title{font-size:13px; color:var(--text-soft); margin:4px 0 8px;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px;}
  .chip{
    flex:0 0 auto; background:var(--teal-soft); color:var(--teal); border:none; border-radius:20px;
    padding:8px 14px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; font-family:inherit;
  }

  .entry{
    display:flex; align-items:center; justify-content:space-between; padding:11px 0;
    border-bottom:1px solid var(--border);
  }
  .entry:last-child{border-bottom:none;}
  .entry .name{font-size:14px; font-weight:600;}
  .entry .meta{font-size:12px; color:var(--text-soft);}
  .entry .kcal{font-family:'Space Grotesk'; font-weight:600; font-size:14px; margin-right:10px;}
  .del{background:none; border:none; color:var(--text-soft); font-size:18px; cursor:pointer; padding:2px 6px;}
  .empty{color:var(--text-soft); font-size:14px; text-align:center; padding:18px 0;}

  label{display:block; font-size:13px; font-weight:600; margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=number], input[type=text], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    font-size:15px; font-family:inherit; background:#fff; color:var(--text);
  }
  .seg{display:flex; gap:8px; margin-top:2px;}
  .seg button{
    flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--border); background:#fff;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--text-soft); cursor:pointer;
  }
  .seg button.sel{background:var(--text); color:#fff; border-color:var(--text);}
  .hint{font-size:12px; color:var(--text-soft); margin-top:6px;}
  .checkline{display:flex; align-items:center; gap:8px; margin-top:16px;}
  .checkline input{width:auto;}
  .checkline label{margin:0; font-size:13px;}

  .result-box{
    background:var(--amber-soft); border-radius:12px; padding:14px; margin-top:16px; text-align:center;
  }
  .result-box .v{font-family:'Space Grotesk'; font-size:26px; font-weight:700; color:var(--text);}
  .result-box .l{font-size:12px; color:var(--text-soft); margin-top:2px;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,35,27,0.5); display:none; align-items:flex-end; z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface); width:100%; max-width:480px; margin:0 auto; border-radius:18px 18px 0 0;
    padding:20px 18px 26px; max-height:86vh; overflow-y:auto;
  }
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .sheet-close{background:none; border:none; font-size:20px; color:var(--text-soft); cursor:pointer;}
  video{width:100%; border-radius:12px; background:#000; max-height:260px; object-fit:cover;}
  .scan-status{font-size:13px; color:var(--text-soft); margin:10px 0; min-height:18px;}
  .over{color:var(--red) !important;}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <h1>Kalorien-Tracker</h1>
    <div class="date" id="todayDate"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="tracker">Heute</button>
    <button class="tab" data-view="profil">Profil</button>
  </div>

  <!-- TRACKER VIEW -->
  <div class="view active" id="view-tracker">
    <div class="card">
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="80" fill="none" stroke="var(--ring-track)" stroke-width="14"/>
          <circle id="ringProgress" cx="100" cy="100" r="80" fill="none" stroke="var(--amber)" stroke-width="14"
            stroke-linecap="round" transform="rotate(-90 100 100)"/>
        </svg>
        <div style="margin-top:-118px;" class="ring-inner">
          <div class="ring-num" id="ringNum">0</div>
          <div class="ring-label" id="ringLabel">kcal übrig</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="v" id="statTarget">–</div><div class="l">Ziel</div></div>
        <div class="stat"><div class="v" id="statConsumed">0</div><div class="l">Verbraucht</div></div>
        <div class="stat"><div class="v" id="statRemaining">–</div><div class="l">Verbleibend</div></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnScan">📷 Scannen</button>
      <button class="btn btn-outline" id="btnManual">+ Manuell</button>
    </div>

    <div class="quick-title">Schnell hinzufügen</div>
    <div class="chips" id="quickChips"></div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:6px;">Heutiges Protokoll</h3>
      <div id="logList"><div class="empty">Noch keine Einträge heute.</div></div>
    </div>
  </div>

  <!-- PROFIL VIEW -->
  <div class="view" id="view-profil">
    <div class="card">
      <label>Geschlecht</label>
      <div class="seg" id="segGender">
        <button data-val="w">Weiblich</button>
        <button data-val="m">Männlich</button>
      </div>

      <label for="inpAge">Alter (Jahre)</label>
      <input type="number" id="inpAge" min="10" max="100" placeholder="z. B. 30">

      <label for="inpHeight">Größe (cm)</label>
      <input type="number" id="inpHeight" min="100" max="230" placeholder="z. B. 175">

      <label for="inpWeight">Gewicht (kg)</label>
      <input type="number" id="inpWeight" min="30" max="300" step="0.1" placeholder="z. B. 78">

      <label for="selActivity">Aktivitätslevel</label>
      <select id="selActivity">
        <option value="1.2">Sitzend (kaum Bewegung)</option>
        <option value="1.375">Leicht aktiv (1–3× Sport/Woche)</option>
        <option value="1.55" selected>Mäßig aktiv (3–5× Sport/Woche)</option>
        <option value="1.725">Sehr aktiv (6–7× Sport/Woche)</option>
        <option value="1.9">Extrem aktiv (körperliche Arbeit + Sport)</option>
      </select>

      <label>Ziel</label>
      <div class="seg" id="segGoal">
        <button data-val="abnehmen">Abnehmen</button>
        <button data-val="halten">Halten</button>
        <button data-val="zunehmen">Zunehmen</button>
      </div>

      <div id="intensityBlock" style="display:none;">
        <label>Tempo</label>
        <div class="seg" id="segIntensity">
          <button data-val="250">Leicht</button>
          <button data-val="500">Moderat</button>
          <button data-val="750">Stark</button>
        </div>
        <div class="hint" id="intensityHint"></div>
      </div>

      <div class="checkline">
        <input type="checkbox" id="chkCustom">
        <label for="chkCustom">Eigenes Kalorienlimit festlegen</label>
      </div>
      <div id="customBlock" style="display:none;">
        <label for="inpCustom">Tägliches Limit (kcal)</label>
        <input type="number" id="inpCustom" min="800" max="6000" placeholder="z. B. 1800">
      </div>

      <div class="result-box" id="resultBox" style="display:none;">
        <div class="v" id="resultVal">–</div>
        <div class="l" id="resultLabel">berechnetes Tagesziel</div>
      </div>

      <button class="btn btn-primary" id="btnSaveProfile" style="width:100%; margin-top:18px;">Berechnen &amp; speichern</button>
    </div>
  </div>

</div>

<!-- SCAN SHEET -->
<div class="overlay" id="scanOverlay">
  <div class="sheet">
    <div class="sheet-head"><h3>Barcode scannen</h3><button class="sheet-close" data-close="scanOverlay">✕</button></div>
    <video id="scanVideo" autoplay playsinline muted></video>
    <div class="scan-status" id="scanStatus">Kamera wird gestartet …</div>
    <label for="manualBarcode">Barcode nicht erkannt? Nummer eingeben</label>
    <input type="text" id="manualBarcode" inputmode="numeric" placeholder="z. B. 4008400122302">
    <button class="btn btn-outline" id="btnLookupManual" style="width:100%; margin-top:10px;">Nachschlagen</button>
  </div>
</div>

<!-- ADD RESULT / MANUAL SHEET -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <div class="sheet-head"><h3 id="addTitle">Eintrag hinzufügen</h3><button class="sheet-close" data-close="addOverlay">✕</button></div>
    <label for="addName">Bezeichnung</label>
    <input type="text" id="addName" placeholder="z. B. Hüttenkäse">

    <label>Eingabeart</label>
    <div class="seg" id="segAddMode">
      <button data-val="total">Gesamt-kcal</button>
      <button data-val="per100">kcal je 100 g</button>
    </div>

    <div id="addTotalBlock">
      <label for="addTotalKcal">Kalorien (kcal)</label>
      <input type="number" id="addTotalKcal" min="0" placeholder="z. B. 320">
    </div>
    <div id="addPer100Block" style="display:none;">
      <label for="addPer100Kcal">kcal je 100 g</label>
      <input type="number" id="addPer100Kcal" min="0" placeholder="z. B. 165">
      <label for="addGrams">Menge (g)</label>
      <input type="number" id="addGrams" min="0" value="100">
      <div class="hint" id="addComputedHint"></div>
    </div>

    <button class="btn btn-primary" id="btnConfirmAdd" style="width:100%; margin-top:18px;">Hinzufügen</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var state = {
    profile: null, // {gender, age, height, weight, activity, goal, intensity, custom, target}
    log: [] // {id, name, kcal, meta}
  };

  var quickFoods = [
    {name:"Apfel", kcal100:52},
    {name:"Banane", kcal100:89},
    {name:"Vollkornbrot", kcal100:247},
    {name:"Hühnerbrust, gegart", kcal100:165},
    {name:"Reis, gekocht", kcal100:130},
    {name:"Nudeln, gekocht", kcal100:131},
    {name:"Ei", kcal100:155},
    {name:"Naturjoghurt", kcal100:61},
    {name:"Haferflocken", kcal100:389},
    {name:"Lachs", kcal100:208},
    {name:"Kartoffeln, gekocht", kcal100:87},
    {name:"Gemüse, gemischt", kcal100:25}
  ];

  var RING_CIRC = 2 * Math.PI * 80;

  function $(id){ return document.getElementById(id); }

  // ---------- Datum ----------
  $('todayDate').textContent = new Date().toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      document.querySelectorAll('.view').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      $('view-' + t.dataset.view).classList.add('active');
    });
  });

  // ---------- Segmented controls (generisch) ----------
  function wireSeg(containerId, onChange){
    var c = $(containerId);
    c.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        c.querySelectorAll('button').forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
        if(onChange) onChange(b.dataset.val);
      });
    });
  }
  var genderVal = 'w', goalVal = 'halten', intensityVal = '500', addModeVal = 'total';
  wireSeg('segGender', function(v){ genderVal = v; });
  wireSeg('segGoal', function(v){
    goalVal = v;
    $('intensityBlock').style.display = (v === 'halten') ? 'none' : 'block';
    updateIntensityHint();
  });
  wireSeg('segIntensity', function(v){ intensityVal = v; updateIntensityHint(); });
  wireSeg('segAddMode', function(v){
    addModeVal = v;
    $('addTotalBlock').style.display = (v === 'total') ? 'block' : 'none';
    $('addPer100Block').style.display = (v === 'per100') ? 'block' : 'none';
  });
  // Defaults selektieren
  $('segGender').querySelector('[data-val="w"]').classList.add('sel');
  $('segGoal').querySelector('[data-val="halten"]').classList.add('sel');
  $('segIntensity').querySelector('[data-val="500"]').classList.add('sel');
  $('segAddMode').querySelector('[data-val="total"]').classList.add('sel');

  function updateIntensityHint(){
    if(goalVal === 'halten'){ $('intensityHint').textContent = ''; return; }
    var sign = goalVal === 'abnehmen' ? '−' : '+';
    $('intensityHint').textContent = sign + intensityVal + ' kcal zum Tagesbedarf';
  }

  $('chkCustom').addEventListener('change', function(){
    $('customBlock').style.display = this.checked ? 'block' : 'none';
  });

  // ---------- Kalorienberechnung (Mifflin-St Jeor) ----------
  function calcTarget(){
    var age = parseFloat($('inpAge').value);
    var height = parseFloat($('inpHeight').value);
    var weight = parseFloat($('inpWeight').value);
    var activity = parseFloat($('selActivity').value);
    if(!age || !height || !weight){
      alert('Bitte Alter, Größe und Gewicht ausfüllen.');
      return null;
    }
    var bmr = genderVal === 'm'
      ? (10*weight + 6.25*height - 5*age + 5)
      : (10*weight + 6.25*height - 5*age - 161);
    var tdee = bmr * activity;
    var delta = 0;
    if(goalVal === 'abnehmen') delta = -parseFloat(intensityVal);
    if(goalVal === 'zunehmen') delta = parseFloat(intensityVal);
    var calculated = Math.round(tdee + delta);

    var useCustom = $('chkCustom').checked;
    var customVal = parseFloat($('inpCustom').value);
    var target = (useCustom && customVal) ? Math.round(customVal) : calculated;

    $('resultBox').style.display = 'block';
    $('resultVal').textContent = target + ' kcal';
    $('resultLabel').textContent = useCustom && customVal
      ? 'dein festgelegtes Tageslimit (berechnet: ' + calculated + ' kcal)'
      : 'berechnetes Tagesziel (TDEE ' + Math.round(tdee) + ' kcal)';

    return {
      gender:genderVal, age:age, height:height, weight:weight, activity:activity,
      goal:goalVal, intensity:intensityVal, custom: useCustom ? customVal : null,
      target: target
    };
  }

  $('btnSaveProfile').addEventListener('click', function(){
    var p = calcTarget();
    if(!p) return;
    state.profile = p;
    renderTracker();
    document.querySelector('.tab[data-view="tracker"]').click();
  });

  // ---------- Log / Ring ----------
  function consumedTotal(){
    return state.log.reduce(function(sum, e){ return sum + e.kcal; }, 0);
  }

  function renderTracker(){
    var target = state.profile ? state.profile.target : null;
    var consumed = Math.round(consumedTotal());
    var remaining = target != null ? (target - consumed) : null;

    $('statTarget').textContent = target != null ? target : 'nicht gesetzt';
    $('statConsumed').textContent = consumed;
    $('statRemaining').textContent = target != null ? remaining : '–';
    $('statRemaining').classList.toggle('over', remaining != null && remaining < 0);

    var frac = target ? Math.min(consumed / target, 1) : 0;
    var over = target != null && consumed > target;
    $('ringProgress').setAttribute('stroke-dasharray', RING_CIRC);
    $('ringProgress').setAttribute('stroke-dashoffset', RING_CIRC * (1 - frac));
    $('ringProgress').setAttribute('stroke', over ? 'var(--red)' : 'var(--amber)');

    if(target == null){
      $('ringNum').textContent = consumed;
      $('ringLabel').textContent = 'kcal heute (kein Ziel gesetzt)';
    } else if(over){
      $('ringNum').textContent = '+' + Math.abs(remaining);
      $('ringLabel').textContent = 'kcal über dem Ziel';
    } else {
      $('ringNum').textContent = remaining;
      $('ringLabel').textContent = 'kcal übrig';
    }

    var listEl = $('logList');
    if(state.log.length === 0){
      listEl.innerHTML = '<div class="empty">Noch keine Einträge heute.</div>';
    } else {
      listEl.innerHTML = '';
      state.log.slice().reverse().forEach(function(entry){
        var row = document.createElement('div');
        row.className = 'entry';
        row.innerHTML =
          '<div><div class="name"></div><div class="meta"></div></div>' +
          '<div style="display:flex; align-items:center;"><span class="kcal"></span><button class="del">×</button></div>';
        row.querySelector('.name').textContent = entry.name;
        row.querySelector('.meta').textContent = entry.meta || '';
        row.querySelector('.kcal').textContent = Math.round(entry.kcal) + ' kcal';
        row.querySelector('.del').addEventListener('click', function(){
          state.log = state.log.filter(function(e){ return e.id !== entry.id; });
          renderTracker();
        });
        listEl.appendChild(row);
      });
    }
  }

  function addEntry(name, kcal, meta){
    state.log.push({id: Date.now() + Math.random(), name:name, kcal:kcal, meta:meta});
    renderTracker();
  }

  // ---------- Quick-Add Chips ----------
  var chipsEl = $('quickChips');
  quickFoods.forEach(function(f){
    var chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = f.name;
    chip.addEventListener('click', function(){
      var grams = parseFloat(prompt('Menge in Gramm für "' + f.name + '":', '100'));
      if(!grams || grams <= 0) return;
      var kcal = f.kcal100 * grams / 100;
      addEntry(f.name, kcal, grams + ' g');
    });
    chipsEl.appendChild(chip);
  });

  // ---------- Overlays ----------
  function openOverlay(id){ $(id).classList.add('open'); }
  function closeOverlay(id){ $(id).classList.remove('open'); }
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click', function(){ closeOverlay(b.dataset.close); });
  });

  // ---------- Manueller Eintrag ----------
  $('btnManual').addEventListener('click', function(){
    $('addTitle').textContent = 'Manuell hinzufügen';
    $('addName').value = '';
    $('addTotalKcal').value = '';
    $('addPer100Kcal').value = '';
    $('addGrams').value = '100';
    openOverlay('addOverlay');
  });

  $('addPer100Kcal').addEventListener('input', updateComputedHint);
  $('addGrams').addEventListener('input', updateComputedHint);
  function updateComputedHint(){
    var per100 = parseFloat($('addPer100Kcal').value) || 0;
    var grams = parseFloat($('addGrams').value) || 0;
    $('addComputedHint').textContent = '= ' + Math.round(per100 * grams / 100) + ' kcal gesamt';
  }

  $('btnConfirmAdd').addEventListener('click', function(){
    var name = $('addName').value.trim() || 'Eintrag';
    var kcal, meta;
    if(addModeVal === 'total'){
      kcal = parseFloat($('addTotalKcal').value);
      meta = '';
    } else {
      var per100 = parseFloat($('addPer100Kcal').value) || 0;
      var grams = parseFloat($('addGrams').value) || 0;
      kcal = per100 * grams / 100;
      meta = grams + ' g';
    }
    if(!kcal || kcal < 0){ alert('Bitte gültige Kalorienangabe machen.'); return; }
    addEntry(name, kcal, meta);
    closeOverlay('addOverlay');
  });

  // ---------- Barcode-Scan ----------
  var scanStream = null, scanning = false;

  $('btnScan').addEventListener('click', function(){
    openOverlay('scanOverlay');
    startScan();
  });
  $('scanOverlay').querySelector('[data-close]').addEventListener('click', stopScan);

  function startScan(){
    $('scanStatus').textContent = 'Kamera wird gestartet …';
    if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia){
      $('scanStatus').textContent = 'Kamera nicht verfügbar. Bitte Barcode-Nummer manuell eingeben.';
      return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
      .then(function(stream){
        scanStream = stream;
        var video = $('scanVideo');
        video.srcObject = stream;
        if(!('BarcodeDetector' in window)){
          $('scanStatus').textContent = 'Automatische Erkennung wird von diesem Browser nicht unterstützt. Bitte Barcode-Nummer unten eingeben.';
          return;
        }
        $('scanStatus').textContent = 'Barcode vor die Kamera halten …';
        scanning = true;
        var detector = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
        var loop = function(){
          if(!scanning) return;
          detector.detect(video).then(function(codes){
            if(codes.length > 0){
              scanning = false;
              var code = codes[0].rawValue;
              $('scanStatus').textContent = 'Erkannt: ' + code + ' – suche Produkt …';
              lookupBarcode(code);
            } else if(scanning){
              requestAnimationFrame(loop);
            }
          }).catch(function(){ if(scanning) requestAnimationFrame(loop); });
        };
        requestAnimationFrame(loop);
      })
      .catch(function(){
        $('scanStatus').textContent = 'Kein Kamerazugriff. Bitte Barcode-Nummer manuell eingeben.';
      });
  }

  function stopScan(){
    scanning = false;
    if(scanStream){
      scanStream.getTracks().forEach(function(t){ t.stop(); });
      scanStream = null;
    }
  }

  $('btnLookupManual').addEventListener('click', function(){
    var code = $('manualBarcode').value.trim();
    if(!code){ alert('Bitte eine Barcode-Nummer eingeben.'); return; }
    $('scanStatus').textContent = 'Suche Produkt …';
    lookupBarcode(code);
  });

  function lookupBarcode(code){
    fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,nutriments')
      .then(function(r){ return r.json(); })
      .then(function(data){
        stopScan();
        if(data.status !== 1 || !data.product){
          $('scanStatus').textContent = 'Produkt nicht gefunden. Bitte manuell hinzufügen.';
          closeOverlay('scanOverlay');
          $('btnManual').click();
          return;
        }
        var p = data.product;
        var kcal100 = p.nutriments && (p.nutriments['energy-kcal_100g'] ||
          (p.nutriments['energy_100g'] ? p.nutriments['energy_100g'] / 4.184 : null));
        closeOverlay('scanOverlay');
        $('addTitle').textContent = 'Gescanntes Produkt';
        $('addName').value = p.product_name || 'Produkt';
        addModeVal = 'per100';
        $('segAddMode').querySelectorAll('button').forEach(function(b){ b.classList.remove('sel'); });
        $('segAddMode').querySelector('[data-val="per100"]').classList.add('sel');
        $('addTotalBlock').style.display = 'none';
        $('addPer100Block').style.display = 'block';
        $('addPer100Kcal').value = kcal100 ? Math.round(kcal100) : '';
        $('addGrams').value = '100';
        updateComputedHint();
        openOverlay('addOverlay');
      })
      .catch(function(){
        stopScan();
        $('scanStatus').textContent = 'Fehler bei der Suche. Bitte manuell hinzufügen.';
      });
  }

  renderTracker();
})();
</script>
</body>
</html>
